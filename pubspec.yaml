name: flutv
description: "Flutv — application Android de streaming TV en direct (chaînes françaises iptv-org)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video player (libmpv)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # Image caching
  cached_network_image: ^3.4.1

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Misc
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
